<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Attendance System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>
<body>
{% if teacher %}
<nav>
  <span class="brand">Attendance System</span>
  <a href="{{ url_for('dashboard') }}">Dashboard</a>
  <a href="{{ url_for('students') }}">Students</a>
  <a href="{{ url_for('attendance') }}">Mark Attendance</a>
  <a href="{{ url_for('report') }}">Report</a>
  <a href="{{ url_for('logout') }}">Logout ({{ teacher.name }})</a>
</nav>
{% endif %}
<div class="container">
  {% if msg %}<div class="msg">{{ msg }}</div>{% endif %}
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
